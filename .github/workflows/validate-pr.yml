name: Validate Registry PR

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate changed index files
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > changed_files.txt
          NON_INDEX=$(grep -v '^index/.*\.json$' changed_files.txt || true)
          if [ -n "$NON_INDEX" ]; then
            echo "Pull requests may only add or update files under index/*.json:"
            echo "$NON_INDEX"
            exit 1
          fi
          grep '^index/.*\.json$' changed_files.txt > index_files.txt || true
          if [ -s index_files.txt ]; then
            xargs -d '\n' -r python3 scripts/validate.py --verify-network < index_files.txt
          fi
