name: Validate Registry PR

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check changed files
        id: changed
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD > changed_files.txt
          cat changed_files.txt
          NON_INDEX=$(grep -v '^index/.*\.json$' changed_files.txt || true)
          if [ -n "$NON_INDEX" ]; then
            echo "Pull requests may only add or update files under index/*.json:"
            echo "$NON_INDEX"
            exit 1
          fi
          INDEX_FILES=$(grep '^index/.*\.json$' changed_files.txt || true)
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$INDEX_FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Validate package metadata and tarballs
        if: steps.changed.outputs.files != ''
        run: |
          python3 scripts/validate.py --verify-network ${{ join(fromJSON(format('["{0}"]', join(split(steps.changed.outputs.files, '\n'), '","'))), ' ') }}
