name: Build Catalog and Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-catalog-main
  cancel-in-progress: false

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate all index entries
        run: python3 scripts/validate.py

      - name: Generate catalog.tsv
        run: python3 scripts/build_catalog.py

      - name: Commit updated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet catalog.tsv docs/catalog.tsv; then
            git add catalog.tsv docs/catalog.tsv
            git commit -m "chore(catalog): regenerate catalog.tsv [skip ci]"
            git pull --rebase origin main
            git push
          fi

  deploy-pages:
    needs: build-catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.pages.outputs.base_url != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        if: steps.pages.outputs.base_url != ''
        id: deployment
        uses: actions/deploy-pages@v4
