<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bozkurt Package Registry</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fafafa;
      --fg: #18181b;
      --muted: #52525b;
      --border: #e4e4e7;
      --card: #ffffff;
      --accent: #b91c1c;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #09090b;
        --fg: #f4f4f5;
        --muted: #a1a1aa;
        --border: #27272a;
        --card: #18181b;
        --accent: #f87171;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 2rem 1rem;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.5;
    }
    main { max-width: 760px; margin: 0 auto; }
    header { margin-bottom: 1.5rem; }
    h1 { font-size: 1.5rem; margin: 0 0 0.25rem; }
    p.sub { margin: 0; color: var(--muted); font-size: 0.95rem; }
    .search-row { margin-bottom: 1.25rem; }
    input[type="search"] {
      width: 100%;
      padding: 0.65rem 0.85rem;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--card);
      color: var(--fg);
    }
    .meta { font-size: 0.85rem; color: var(--muted); margin-bottom: 1rem; }
    .list { display: flex; flex-direction: column; gap: 0.75rem; }
    .pkg {
      padding: 0.9rem 1rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--card);
    }
    .pkg-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.75rem;
    }
    .pkg-name { font-weight: 600; font-size: 1.05rem; }
    .pkg-ver { font-family: var(--mono); font-size: 0.85rem; color: var(--muted); }
    .pkg-desc { margin: 0.35rem 0 0.6rem; color: var(--muted); font-size: 0.92rem; }
    .pkg-foot {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      font-size: 0.82rem;
    }
    .pkg-foot a { color: var(--accent); text-decoration: none; }
    .pkg-foot a:hover { text-decoration: underline; }
    code {
      font-family: var(--mono);
      padding: 0.15rem 0.4rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Bozkurt Package Registry</h1>
      <p class="sub">Official package index for <code>bzc pkg</code>.</p>
    </header>
    <div class="search-row">
      <input id="q" type="search" placeholder="Filter packages by name or description..." autocomplete="off">
    </div>
    <div id="status" class="meta">Loading catalog...</div>
    <div id="results" class="list"></div>
  </main>
  <script>
    const qInput = document.getElementById("q");
    const statusEl = document.getElementById("status");
    const resultsEl = document.getElementById("results");
    let packages = [];

    function esc(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function render(items) {
      statusEl.textContent = `${items.length} package${items.length === 1 ? "" : "s"}`;
      if (items.length === 0) {
        resultsEl.innerHTML = "";
        return;
      }
      resultsEl.innerHTML = items.map(p => `
        <article class="pkg">
          <div class="pkg-head">
            <span class="pkg-name">${esc(p.name)}</span>
            <span class="pkg-ver">v${esc(p.version)}</span>
          </div>
          <p class="pkg-desc">${esc(p.description)}</p>
          <div class="pkg-foot">
            <code>${esc(p.name)} = "${esc(p.version)}"</code>
            <a href="${esc(p.repo)}" target="_blank" rel="noopener">Repository</a>
          </div>
        </article>
      `).join("");
    }

    function filter() {
      const term = qInput.value.trim().toLowerCase();
      if (!term) {
        render(packages);
        return;
      }
      render(packages.filter(p =>
        p.name.toLowerCase().includes(term) ||
        p.description.toLowerCase().includes(term)
      ));
    }

    fetch("./catalog.tsv")
      .then(r => {
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return r.text();
      })
      .then(text => {
        packages = text
          .split(/\r?\n/)
          .filter(line => line.trim() && !line.startsWith("#"))
          .map(line => {
            const [name = "", version = "", description = "", repo = "", sha256 = ""] = line.split("\t");
            return { name, version, description, repo, sha256 };
          });
        render(packages);
      })
      .catch(err => {
        statusEl.textContent = `Failed to load catalog.tsv: ${err.message}`;
      });

    qInput.addEventListener("input", filter);
  </script>
</body>
</html>
